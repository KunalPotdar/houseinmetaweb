<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Parc de Lac 360° View</title>
  <link rel="stylesheet" href="parc.css" />
</head>
<body>

  <!-- VIEWER -->
  <div id="spin-container">
    <img id="spin-img" src="" alt="Maison M2 360° view" draggable="false" />
    <canvas id="poly-canvas"></canvas>

    <!-- Floor selector -->
    <div id="floor-selector">
      <button class="floor-btn active" data-floor="0">Aerial</button>
      <button class="floor-btn" data-floor="1">Floor 1</button>
      <button class="floor-btn" data-floor="2">Floor 2</button>
      <button class="floor-btn" data-floor="3">Floor 3</button>
      <button class="floor-btn" data-floor="4">Floor 4</button>
    </div>

  </div>

  <!-- APARTMENT WIDGET -->
  <div id="apt-widget" class="apt-widget hidden">
    <button class="apt-widget-close" id="apt-widget-close">&#10005;</button>
    <div class="apt-widget-name">Apartment 202</div>
    <div class="apt-widget-surface">Surface&nbsp;85 m²</div>
    <div class="apt-widget-actions">
      <button class="apt-widget-btn apt-widget-btn--2d">View 2D Plan</button>
      <button class="apt-widget-btn apt-widget-btn--3d">3D Walkthrough</button>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <button id="spin-btn">⟳ Auto</button>
    <span class="frame-counter" id="frame-counter">1 / 1</span>
  </div>

  <script src="parc.js"></script>
</body>
</html>
