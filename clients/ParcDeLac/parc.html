<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Parc de Lac 360° View</title>
  <link rel="stylesheet" href="parc.css" />
</head>
<body>

  <!-- LOADING OVERLAY -->
  <div id="loading-overlay">
    <div class="loading-card">
      <img class="loading-logo" src="../../assets/images/logo.png" alt="HouseInMeta" />
      <div class="loading-title">HouseInMeta</div>
      <div class="loading-subtitle">Parc de Lac &mdash; 360° View</div>
      <div class="loading-bar-track">
        <div class="loading-bar-fill" id="loading-bar"></div>
      </div>
      <div class="loading-status" id="loading-status">Loading&hellip;</div>
      <div class="loading-powered">Powered by <strong>HouseInMeta</strong></div>
    </div>
  </div>

  <!-- VIEWER -->
  <div id="spin-container">
    <img id="spin-img" src="" alt="Maison M2 360° view" draggable="false" />
    <canvas id="poly-canvas"></canvas>

    <!-- Compass -->
    <div id="compass">
      <svg id="compass-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer ring -->
        <circle cx="40" cy="40" r="36" fill="rgba(42,42,42,0.88)" stroke="rgba(78,140,225,0.35)" stroke-width="1.5"/>
        <!-- Cardinal labels -->
        <text x="40" y="11" text-anchor="middle" fill="#4e8ce1" font-size="9" font-family="Segoe UI,sans-serif" font-weight="700">N</text>
        <text x="40" y="73" text-anchor="middle" fill="rgba(224,224,224,0.5)" font-size="8" font-family="Segoe UI,sans-serif">S</text>
        <text x="70" y="44" text-anchor="middle" fill="rgba(224,224,224,0.5)" font-size="8" font-family="Segoe UI,sans-serif">E</text>
        <text x="10" y="44" text-anchor="middle" fill="rgba(224,224,224,0.5)" font-size="8" font-family="Segoe UI,sans-serif">W</text>
        <!-- Needle group (rotated by JS) -->
        <g id="compass-needle" transform="rotate(0 40 40)">
          <!-- North tip (red) -->
          <polygon points="40,16 37,40 43,40" fill="#e05555"/>
          <!-- South tip (light) -->
          <polygon points="40,64 37,40 43,40" fill="rgba(224,224,224,0.35)"/>
          <!-- Center dot -->
          <circle cx="40" cy="40" r="3" fill="rgba(42,42,42,1)" stroke="rgba(78,140,225,0.6)" stroke-width="1"/>
        </g>
      </svg>
    </div>

    <!-- Floor selector -->
    <div id="floor-selector">
      <button class="floor-btn active" data-floor="0">Aerial</button>
      <button class="floor-btn" data-floor="4">R+3</button>
      <button class="floor-btn" data-floor="3">R+2</button>
      <button class="floor-btn" data-floor="2">R+1</button>
      <button class="floor-btn" data-floor="1">RDC</button>
    </div>

  </div>

  <!-- APARTMENT WIDGET -->
  <div id="apt-widget" class="apt-widget hidden">
    <button class="apt-widget-close" id="apt-widget-close">&#10005;</button>
    <div class="apt-widget-name">Apartment 202</div>
    <div class="apt-widget-surface">Surface&nbsp;85 m²</div>
    <div class="apt-widget-actions">
      <button class="apt-widget-btn apt-widget-btn--2d">Vue 2D</button>
      <button class="apt-widget-btn apt-widget-btn--3d">Vue 3D</button>
      <button class="apt-widget-btn apt-widget-btn--rt">Visite 3D Temps R&eacute;el</button>
    </div>
  </div>

  <!-- VISITE 3D TEMPS RÉEL MODAL -->
  <div id="visitert-modal" class="plan2d-modal hidden">
    <div class="plan2d-backdrop" id="visitert-backdrop"></div>
    <div class="plan2d-frame visitert-frame">
      <button class="plan2d-close" id="visitert-close">&#10005;</button>
      <div class="plan2d-title">Visite 3D Temps R&eacute;el &mdash; Appartement A202</div>
      <iframe
        id="visitert-iframe"
        class="visitert-iframe"
        src="about:blank"
        allow="pointer-lock; fullscreen"
        allowfullscreen
        frameborder="0"
      ></iframe>
    </div>
  </div>

  <!-- 3D PLAN MODAL -->
  <div id="plan3d-modal" class="plan2d-modal hidden">
    <div class="plan2d-backdrop" id="plan3d-backdrop"></div>
    <div class="plan2d-frame">
      <button class="plan2d-close" id="plan3d-close">&#10005;</button>
      <div class="plan2d-title">Vue 3D &mdash; Appartement A202</div>
      <div class="plan2d-img-wrap">
        <img class="plan2d-img" id="plan3d-img"
             src="https://apt-hsim-models.s3.eu-west-3.amazonaws.com/ParcDeLac/Lot/3D+plan.jpg"
             alt="Vue 3D A202" />
      </div>
    </div>
  </div>

  <!-- 2D PLAN MODAL -->
  <div id="plan2d-modal" class="plan2d-modal hidden">
    <div class="plan2d-backdrop" id="plan2d-backdrop"></div>
    <div class="plan2d-frame">
      <button class="plan2d-close" id="plan2d-close">&#10005;</button>
      <div class="plan2d-title">Plan 2D &mdash; Appartement A202</div>
      <div class="plan2d-img-wrap">
        <img class="plan2d-img" id="plan2d-img"
             src="https://apt-hsim-models.s3.eu-west-3.amazonaws.com/ParcDeLac/Lot/2D+plan-A202.jpg"
             alt="Plan 2D A202" />
      </div>
    </div>
  </div>

  <script src="parc.js"></script>
</body>
</html>
