<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visite 3D Temps Reel - Parc de Lac</title>
  <meta name="description" content="Visite 3D temps reel du projet Parc de Lac.">
  <style>
    :root {
      --bg: #0d1017;
      --surface: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.16);
      --text: #eef2fb;
      --muted: #9aa7bf;
      --accent: #4e8ce1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .page {
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100%;
      height: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(13, 16, 23, 0.88);
      backdrop-filter: blur(8px);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .badge {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(78, 140, 225, 0.14);
      border: 1px solid rgba(78, 140, 225, 0.35);
      border-radius: 999px;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .title {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.14);
    }

    .btn-main {
      background: var(--accent);
      border-color: rgba(78, 140, 225, 0.7);
      color: #fff;
    }

    .viewer {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    @media (max-width: 720px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-left">
        <span class="badge">Parc de Lac</span>
        <div class="title">Visite 3D Temps Reel</div>
      </div>
      <div class="actions">
        <button id="back-btn" class="btn" type="button">Retour a la page precedente</button>
        <a class="btn btn-main" href="../../index.html">Retour a la page principale</a>
      </div>
    </header>

    <iframe
      class="viewer"
      src="../lodge/apartment_view.html"
      title="Visite 3D Temps Reel"
      allow="fullscreen; xr-spatial-tracking"
      allowfullscreen
      loading="eager"
    ></iframe>
  </div>

  <script>
    document.getElementById('back-btn').addEventListener('click', function () {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }
      window.location.href = 'parc.html';
    });
  </script>
</body>
</html>
