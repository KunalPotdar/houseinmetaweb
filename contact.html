<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Free Demo — House in Meta</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/images/favicon.ico" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand"><div class="logo">H</div><h1>House in Meta</h1></div>
      <nav>
        <a href="/">Home</a>
        <a href="/projects.html">Projects</a>
        <a href="/pages/about.html">About</a>
        <a href="/contact.html">Free Demo</a>
      </nav>
    </header>

    <main class="hero">
      <section class="card">
        <h2 style="font-size:2.5rem;margin:0 0 1.5rem" data-i18n="contact.title">Connect with us</h2>
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:1.5rem;align-items:start">
          <form id="contactForm" data-appscript-url="https://script.google.com/macros/s/AKfycbxsvrChafFpOZOLYVFeRRczMFYEJUgqlUnEeLbEGYW83VznbBhnCX9QhaG96tFb-Psv/exec" novalidate>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
              <div>
                <label for="contactName" style="display:block;margin-bottom:.4rem">Full Name</label>
                <input id="contactName" name="name" type="text" required style="width:100%;padding:.75rem;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(255,255,255,.08);color:var(--text)">
              </div>
              <div>
                <label for="contactEmail" style="display:block;margin-bottom:.4rem">Email</label>
                <input id="contactEmail" name="email" type="email" required style="width:100%;padding:.75rem;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(255,255,255,.08);color:var(--text)">
              </div>
            </div>
            <div style="margin-top:1rem">
              <label for="contactPhone" style="display:block;margin-bottom:.4rem">Phone (Optional)</label>
              <input id="contactPhone" name="phone" type="tel" style="width:100%;padding:.75rem;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(255,255,255,.08);color:var(--text)">
            </div>
            <div style="margin-top:1rem">
              <label for="contactSubject" style="display:block;margin-bottom:.4rem">Subject</label>
              <input id="contactSubject" name="subject" type="text" required style="width:100%;padding:.75rem;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(255,255,255,.08);color:var(--text)">
            </div>
            <button type="submit" style="margin-top:1rem;padding:.8rem 1.1rem;border:none;border-radius:8px;background:var(--accent);color:white;font-weight:600;cursor:pointer">Send Message</button>
            <p id="contactFormStatus" style="margin-top:.75rem;min-height:1.25rem"></p>
          </form>
          <div style="background:var(--accent);padding:1.5rem;border-radius:8px">
            <h4 style="margin-top:0" data-i18n="contact.location">Location</h4>
            <p class="muted" style="margin:0"><span data-i18n="contact.paris">Paris, France</span><br><span data-i18n="contact.available">Available Worldwide</span></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">© House in Meta</footer>
  </div>
  <script src="/assets/js/contact-form.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
